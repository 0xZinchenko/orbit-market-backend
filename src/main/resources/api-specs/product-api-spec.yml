openapi: 3.0.0
info:
  title: Product API
  description: API for managing marketplace products and categories
  version: 1.0.0
paths:
  /api/v1/products:
    post:
      summary: Create a new product
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDTO'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDTO'
        '400':
          description: Validation error or invalid product state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'

    get:
      summary: Get all products
      tags:
        - Products
      responses:
        '200':
          description: List of all products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductDTO'

  /api/v1/products/{id}:
    get:
      summary: Get product by id
      tags:
        - Products
      parameters:
        - in: path
          name: id
          required: true
          description: ID of the product to retrieve
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDTO'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    put:
      summary: Update product
      tags:
        - Products
      parameters:
        - in: path
          name: id
          required: true
          description: Product identifier
          schema:
            type: integer
            format: int64

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDTO'

      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDTO'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '400':
          description: Validation error or invalid product state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'

    delete:
      summary: Delete product
      tags:
        - Products
      parameters:
        - in: path
          name: id
          required: true
          description: Product identifier
          schema:
            type: integer
            format: int64

      responses:
        '204':
          description: Product deleted successfully

        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/products/{id}/price:
    get:
      summary: Get product price converted to another currency
      description: >
        Converts the product's price (stored in USD) into the requested
        currency using a live exchange rate from a third-party currency API.
      tags:
        - Products
      parameters:
        - in: path
          name: id
          required: true
          description: Product identifier
          schema:
            type: integer
            format: int64
        - in: query
          name: currency
          required: true
          description: ISO 4217 currency code to convert the price into (e.g. EUR)
          schema:
            type: string
          example: EUR

      responses:
        '200':
          description: Converted product price
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPriceDTO'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '502':
          description: Currency provider is unavailable or returned an unexpected response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/categories:
    post:
      summary: Create a new category
      tags:
        - Categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryDTO'
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDTO'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'

    get:
      summary: Get all categories
      tags:
        - Categories
      responses:
        '200':
          description: List of all categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryDTO'

  /api/v1/categories/{id}:
    get:
      summary: Get category by id
      tags:
        - Categories
      parameters:
        - in: path
          name: id
          required: true
          description: ID of the category to retrieve
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Category found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDTO'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    put:
      summary: Update category
      tags:
        - Categories
      parameters:
        - in: path
          name: id
          required: true
          description: Category identifier
          schema:
            type: integer
            format: int64

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryDTO'

      responses:
        '200':
          description: Category updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDTO'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'

    delete:
      summary: Delete category
      tags:
        - Categories
      parameters:
        - in: path
          name: id
          required: true
          description: Category identifier
          schema:
            type: integer
            format: int64

      responses:
        '204':
          description: Category deleted successfully

        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'


components:
  schemas:
    ProductDTO:
      type: object

      required:
        - name
        - price

      properties:
        id:
          type: integer
          format: int64
          readOnly: true

        name:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            Product name.
            Must contain at least one cosmic word (case-insensitive):
            star, galaxy, or comet.
          example: Galaxy Cat

        price:
          type: number
          minimum: 0
          example: 199.99

        categoryId:
          type: integer
          format: int64
          nullable: true
          description: ID of an existing Category this product belongs to. Optional.
          example: 1

    ProductPriceDTO:
      type: object
      properties:
        productId:
          type: integer
          format: int64
          example: 1

        originalPrice:
          type: number
          description: Price as stored on the product, in USD
          example: 100.00

        currency:
          type: string
          description: Currency the price was converted into
          example: EUR

        convertedPrice:
          type: number
          example: 92.00

    CategoryDTO:
      type: object

      required:
        - name
        - description

      properties:
        id:
          type: integer
          format: int64
          readOnly: true

        name:
          type: string
          minLength: 1
          maxLength: 256
          example: Snacks

        description:
          type: string
          minLength: 1
          maxLength: 256
          example: Cosmic snacks for space cats

    ProblemDetail:
      type: object

      properties:
        type:
          type: string
          format: uri
          example: about:blank

        title:
          type: string
          example: Not found

        status:
          type: integer
          format: int32
          example: 404

        detail:
          type: string
          example: "Product with id: 10 not found"

        instance:
          type: string
          format: uri
          example: /api/v1/products/10

    ValidationProblemDetail:
      description: >
        ProblemDetail returned when request body fails Bean Validation
        (@Valid). Extends the base ProblemDetail with a map of
        field name to the list of all validation messages for that field.
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          properties:
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              example:
                name: ["must not be blank", "Name must be -  star, galaxy, comet"]
                price: ["must not be null"]
